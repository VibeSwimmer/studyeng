 document.getElementById("kn").innerHTML="<summary>Слова, которые я знаю ("+kk.length+")</summary>"+(kk.length?kk.map(k=>"<button class='chip' data-r=\""+esc(k)+"\">"+esc(MAP[k]?MAP[k].w:k)+" ↩</button>").join(" "):"<div class='sub'>Пока пусто</div>")}
function render(){stats();var k=cur(),n=todayN(),h="";
 document.getElementById("info").textContent="Сегодня: "+n+" из "+S.per+(n>=S.per?" 🎉":"")+" · Серия: "+streak()+" дн. · Осталось новых: "+S.deck.length;
 document.getElementById("prog").style.width=Math.min(100,n/S.per*100)+"%";
 document.getElementById("per").innerHTML="<span class='sub'>Цель в день:</span>"+[3,5,10].map(x=>"<button class='chip"+(x===S.per?" on":"")+"' onclick='setPer("+x+")'>"+x+"</button>").join("");
 if(k){var v=view(k);
  h="<div class='card' data-k=\""+esc(k)+"\"><div class='w'><div><b>"+esc(v.w)+"</b> <span class='ipa'>"+(v.ipa?"/"+esc(v.ipa)+"/":"")+"</span>"+(v.ipa?"":"<button class='edit' data-a='retry'>↻</button>")+"<div class='tag'>"+esc(v.t)+" · "+esc(v.c)+"</div></div><button class='sp' data-a='say' aria-label='Произнести'>🔊</button></div>"+
  "<div class='ru'>"+(v.ru?esc(v.ru):"<span class='sub'>перевод не найден</span>")+"<button class='edit' data-a='ru'>✎</button></div>"+
  v.ex.map(e=>"<div class='ex' data-a='ex'>"+esc(e)+"</div>").join("")+
  "<div class='acts'><button class='btn' data-a='done'>Выучил</button><button class='btn alt' data-a='know'>Уже знаю</button></div><button class='btn alt' data-a='skip'>Пропустить →</button></div>"}
 else h="<div class='card sub'>Все слова пройдены. Добавьте новые в форме ниже.</div>";
 if(S.last&&MAP[S.last.k])h+="<button class='reset' data-a='undo'>↩ Отменить: "+esc(MAP[S.last.k].w)+" ("+({done:"выучил",know:"знаю",skip:"пропуск"}[S.last.a])+")</button>";
 document.getElementById("list").innerHTML=h;pre()}
document.getElementById("list").onclick=e=>{var b=e.target.closest("[data-a]");if(!b)return;var a=b.dataset.a,c=b.closest(".card"),k=c&&c.dataset.k;
 if(a=="say")say(k);else if(a=="ex")tts(b.textContent);else if(a=="undo")undo();
 else if(a=="retry"){tr[k]=0;(S.meta[k]=S.meta[k]||{}).tried=0;enrich(k).then(render)}
 else if(a=="ru"){var x=prompt("Перевод для «"+MAP[k].w+"»:",view(k).ru);if(x!==null){(S.meta[k]=S.meta[k]||{}).ru=x.trim();save();render()}}
 else act(a)};
var inp=document.getElementById("inp"),st=document.getElementById("st");
function parts(){return inp.value.split(/[\n,;]+/).map(norm).filter(Boolean)}
inp.oninput=()=>{var p=parts(),h=p.filter(k=>MAP[k]),n=p.filter(k=>!MAP[k]);
 st.textContent=p.length?(h.length?"Уже есть: "+h.join(", ")+". ":"")+(n.length?"Новые: "+n.join(", "):""):""};
document.getElementById("add").onclick=()=>{var add=[],dup=[],bad=[];
 parts().forEach(k=>{if(!/^[a-z][a-z' -]{1,40}$/.test(k)){bad.push(k);return}
  if(MAP[k]||add.indexOf(k)>=0){dup.push(k);return}
  var it={k:k,w:k,c:"Мои слова"};S.custom.push(it);MAP[k]=it;S.deck.splice(rnd(Math.min(10,S.deck.length)+1),0,k);add.push(k)});
 save();inp.value="";
 var msg=(add.length?"Добавлено: "+add.join(", ")+" (скоро появятся в ленте). ":"")+(dup.length?"Уже были: "+dup.join(", ")+". ":"")+(bad.length?"Не похоже на слово: "+bad.join(", ")+".":"");
 st.textContent=msg||"Ничего не введено.";render();if(add.length)enrichAll(add,true).then(()=>{st.textContent=msg})};
document.getElementById("reset").onclick=()=>{if(confirm("Сбросить прогресс? Добавленные слова и список «Уже знаю» останутся.")){S=Object.assign(S,{deck:[],done:[],full:[],doneAt:{},last:null});syncDeck();save();render()}};
document.getElementById("kn").onclick=e=>{var b=e.target.closest("[data-r]");if(b)unknow(b.dataset.r)};
syncDeck();save();render();
enrichAll(S.custom.map(x=>x.k).filter(k=>{var v=view(k);return !v.ipa||!v.ru}));
</script>
</body>
